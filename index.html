function quests(){ui(`<h2>🗺 Level select</h2>`+Z.map((z,i)=>`<div class="cd rw ${unl(i)?"":"lk"}"><span>${done(i)?"✅":unl(i)?"🏝":"🔒"} ${i+1}. ${z[0]}</span>${unl(i)?`<button class="sm" onclick="goT(${i})">${done(i)?"Review":"Start"}</button>`:""}</div>`).join("")+`<button class="b" onclick="home()">Back</button>`)}
function dash(){const a=P.acc||{},t=Object.values(a).reduce((x,v)=>[x[0]+v[0],x[1]+v[1]],[0,0]);
ui(`<div class="cd"><h2>📊 ${esc(P.name)} · ${rk()}</h2><p>Enrollment: ${esc(P.enr||"")}<br>Level ${lv()} · XP ${P.xp} · 🪙 ${P.coins} · ⭐ ${P.stars}<br>Zones cleared: ${P.cleared.length}/${Z.length} · Arena wins: ${P.arena||0}<br>Overall accuracy: ${t[1]?Math.round(t[0]/t[1]*100):0}%</p></div><div class="cd"><b>Accuracy by topic</b>${Z.map((z,i)=>{const v=a[i]||[0,0],p=v[1]?Math.round(v[0]/v[1]*100):0;return `<small>${z[0]} · ${p}%</small><div class="bar"><i style="width:${p}%"></i></div>`}).join("")}<small>Short bars = topics to revise 📖</small></div><button class="b" onclick="menu()">Back</button>`)}
function board(){const L=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("nn_")&&k!="nn_last"){const p=JSON.parse(localStorage.getItem(k));if(p&&p.name)L.push(p)}}}catch(e){}
L.sort((a,b)=>b.xp-a.xp);ui(`<h2>🏆 Leaderboard</h2><small>Heroes registered on this device</small>`+(L.slice(0,10).map((p,i)=>`<div class="cd rw"><span>${["🥇","🥈","🥉"][i]||(i+1)+"."} ${esc(p.name)}</span><span>Lv ${1+Math.floor(p.xp/70)} · ⭐${p.stars} · ${p.xp} XP</span></div>`).join("")||"<p>No heroes yet.</p>")+`<button class="b" onclick="menu()">Back</button>`)}
function how(){ui(`<div class="cd"><h2>❓ How to play</h2><p>1️⃣ Tap the ground to walk.<br>2️⃣ Tap a tower or teacher to learn a topic.<br>3️⃣ Tap the monster to fight. You and the monster both start with 30 HP; right answers hit it, wrong answers hurt you. If you lose, the monster comes back with 40 HP; if you win, your max HP grows.<br>4️⃣ Clear a zone to unlock the next one.<br>5️⃣ Open 🎁 chests for coins; buy 🧪 potions and ✂ 50/50s from Trader Multi (gold-roof stall).<br>6️⃣ Try the 10-Question Quest, Friends duel or the Arena for bonus XP.</p></div><button class="b" onclick="menu()">Back</button>`)}
function shop(){ui(`<div class="cd"><h2>🛒 Trader Multi</h2><p>Your coins: 🪙 ${P.coins}</p><div class="cd rw"><span>🧪 Potion (+15 HP in a fight)<br><small>You have ${P.inv.pot}</small></span><button class="sm" onclick="buy('pot',15)">15🪙</button></div><div class="cd rw"><span>✂ 50/50 (hides 2 wrong answers)<br><small>You have ${P.inv.scr}</small></span><button class="sm" onclick="buy('scr',25)">25🪙</button></div><button class="b" onclick="home()">Back</button></div>`)}
function buy(k,c){if(P.coins<c)return msg("Not enough coins!");P.coins-=c;P.inv[k]++;sv();hud();shop()}
function pod(i){if(P.chests.includes(i))return msg("This chest is empty");P.chests.push(i);const c=10+Math.floor(Math.random()*16);P.coins+=c;let t="🪙 +"+c;if(Math.random()<.4){P.inv.pot++;t+=" · 🧪 potion"}sv();refresh();msg("🎁 Chest: "+t)}
let LE;
function study(i){bt=null;LE={i,p:0,e:[E[i][0](),E[i][1]()]};lp(0)}
function lp(d){LE.p=Math.max(0,Math.min(4,LE.p+d));const i=LE.i,p=LE.p,t=LS[i],z=Z[i],bg='style="background:#f5e9da;color:#3a1d3f"';let b="";
if(p==0)b=`<div class="cd" ${bg}>“Namaste, ${esc(P.name)}! Main hoon <b>${z[1]}</b>. ${t.g}”</div><div class="cd"><small>Aaj ka topic:</small> <b>${z[0]}</b></div>`;
if(p==1)b=`<b>📖 Concept</b><div class="cd" style="margin-top:6px">${t.c}</div><div class="cd">🧠 Yaad rakho: ${t.t}</div>`;
if(p==2||p==3){const e=LE.e[p-2];b=`<b>${p==2?"✍️ Worked example 1":"🎓 Worked example 2 (exam level)"}</b><div class="cd" style="margin-top:6px">${e[0]}</div>${e[5]||""}<div class="cd" ${bg}>📐 <b>Rule:</b> ${e[1]}<br>🧮 <b>Steps:</b> ${e[2]}<br>✅ <b>Answer:</b> ${e[3]}<br>💡 ${e[4]}</div><button class="b m" onclick="nex(${p-2})">🔄 New example</button>`}
if(p==4)b=`<b>⚠️ Common mistake</b><div class="cd" style="margin-top:6px">${t.m}</div><div class="cd" ${bg}>“Ab tum taiyaar ho! Monster ko in rules se haraao.”</div>`;
ui(`<div class="rw" style="padding:0"><b style="font-size:1.2rem">🧙 ${z[1]}</b><button class="sm" onclick="home()">✕</button></div><small>${z[0]} · page ${p+1}/5</small><div class="bar"><i style="width:${(p+1)*20}%;background:#f59e0b"></i></div>${b}<div class="rw" style="padding:0"><button class="sm" onclick="lp(-1)">← Back</button>${p<4?`<button class="sm" onclick="lp(1)">Next →</button>`:`<button class="sm" style="background:#16a34a" onclick="fight(${i})">⚔️ Fight!</button>`}</div>`)}
function nex(k){let e,t=0;do{e=E[LE.i][k]()}while(e[0]===LE.e[k][0]&&t++<30);LE.e[k]=e;lp(0)}
function fight(i){P.mb=P.mb||{};P.inv.pot=Math.max(1,P.inv.pot||0);P.inv.scr=Math.max(1,P.inv.scr||0);F={i,qs:[],mm:P.mb[i]||30,mh:P.mb[i]||30,hp:mhp(),mx:mhp()};bt={i};bmB.material.color.setHex(PAL[i]);nq()}
function nq(){const q=getQ(F.i);F.qs=[q];F.o=sh(q[2].map((t,k)=>[t,k]));F.x=[];F.hint=0;F.lock=false;rn()}
function rn(){const q=F.qs[0];
ui(`<small id="mt">⚔️ ${Z[F.i][0]} Monster · HP ${F.mh}/${F.mm}</small><div class="bar r" id="mb"><i style="width:${F.mh/F.mm*100}%"></i></div><small id="ht">Your HP ${F.hp}/${F.mx}</small><div class="bar" id="hb"><i style="width:${F.hp/F.mx*100}%"></i></div><div class="cd"><b>${q[1]}</b>${F.hint?`<div class="ex">💡 <b>Hint:</b> ${qhint(q)}${qhint(q)?". ":""}${LS[F.i].h}</div>`:""}${F.o.map((x,k)=>F.x.includes(k)?"":`<button class="opt" data-k="${k}" onclick="ans(${k})"><b class="lt">${"ABCD"[k]}</b>${x[0]}</button>`).join("")}<div id="fb"></div></div><div class="fr"><button class="sm" onclick="scr()">✂ 50/50 ×${P.inv.scr}</button><button class="sm" onclick="pot()">🧪 ×${P.inv.pot}</button><button class="sm" style="background:#ec4899" onclick="hnt()">💡 Hint</button><button class="sm" style="background:#475569" onclick="home()">🏃 Flee</button></div>`)}
function hnt(){if(F.lock)return msg("Tap Next first");F.hint=1;rn()}
function pot(){if(F.lock)return msg("Tap Next first");if(!P.inv.pot)return msg("No potions left! Buy at Trader Multi");if(F.hp>=F.mx)return msg("Your HP is already full!");P.inv.pot--;F.hp=Math.min(F.mx,F.hp+15);sv();rn();msg("🧪 Potion used: HP restored")}
function scr(){if(F.lock)return msg("Tap Next first");if(!P.inv.scr)return msg("No 50/50 left! Buy at Trader Multi");const q=F.qs[0],w=F.o.map((x,k)=>k).filter(k=>F.o[k][1]!==q[3]&&!F.x.includes(k));if(w.length<2)return msg("Already used on this question");P.inv.scr--;F.x=F.x.concat(sh(w).slice(0,2));sv();rn();msg("✂ 2 wrong options removed")}
function bars(){$("mt").textContent="⚔️ "+Z[F.i][0]+" Monster · HP "+F.mh+"/"+F.mm;$("mb").innerHTML=`<i style="width:${F.mh/F.mm*100}%"></i>`;$("ht").textContent="Your HP "+F.hp+"/"+F.mx;$("hb").innerHTML=`<i style="width:${F.hp/F.mx*100}%"></i>`}
function ans(k){if(F.lock)return;F.lock=true;const q=F.qs[0],ok=F.o[k][1]===q[3],bs=[...document.querySelectorAll(".opt")];F.last=q;
bs.forEach(b=>{const j=+b.dataset.k;b.disabled=true;if(F.o[j][1]===q[3])b.classList.add("ok");else if(j!==k)b.classList.add("dim")});
const a=P.acc[F.i]=P.acc[F.i]||[0,0];a[1]++;bt&&(bt.fx={w:ok?"m":"h",t0:clk.elapsedTime});
const d=ok?rnd(8,12):rnd(6,10),z=LS[F.i];let h;if(bt)bt.fx.d=d;
if(ok){a[0]++;F.mh-=d;P.xp+=10;P.coins+=5;h=`💥 <b>Critical hit! You hit the monster for ${d}</b><br>🧮 ${q[4]}`}
else{bs.find(b=>+b.dataset.k===k).classList.add("bad");F.hp-=d;h=`💢 <b>Ouch! The monster hits you for ${d}</b><br>You chose <b>${F.o[k][0]}</b>; correct answer is <b>${F.o.find(o=>o[1]===q[3])[0]}</b>.<br>📐 <b>Rule:</b> ${z.h}<br>🧮 <b>Working:</b> ${q[4]}<br>⚠️ <b>Watch out:</b> ${z.m}`}
F.qs.shift();F.mh=Math.max(F.mh,0);F.hp=Math.max(F.hp,0);if(bt)bt.fx.dead=F.hp<=0||F.mh<=0;const end=F.hp<=0||F.mh<=0;
$("fb").innerHTML=`<div class="cd" style="background:#f5e9da;color:#3a1d3f">${h}</div><button class="b g" onclick="${F.hp<=0?"lose()":F.mh<=0?"win()":"nq()"}">${end?"See result →":"Next →"}</button>`;sv();hud();bars()}
const BG='style="background:#f5e9da;color:#3a1d3f"',BTN=i=>`<button class="b g" onclick="fight(${i})">⚔️ Rematch</button><button class="b m" onclick="study(${i})">📘 Study this topic</button><button class="b" onclick="home()">🌍 Back to the village</button>`;
function lose(){P.mb[F.i]=40;sv();ui(`<div class="cd" style="text-align:center"><b>💔 You fainted…</b></div><div class="cd" ${BG}>“Himmat mat haaro! Topic dobara padho aur wapas ladho.”<br><small style="color:#7a5a7a">The monster grew stronger: 40 HP next time.</small></div>${BTN(F.i)}`)}
function win(){const i=F.i,L=lv(),first=!done(i);P.mb=P.mb||{};delete P.mb[i];
if(first){P.hpb=(P.hpb||0)+5;P.cleared.push(i);P.stars++;P.xp+=20;P.coins+=20}else P.coins+=10;
sv();refresh();ui(`<div class="cd" style="text-align:center"><b>🏆 Victory!</b></div><div class="cd" ${BG}>“Shabaash, ${esc(P.name)}! Tumne ${Z[i][0]} ka monster haraa diya.”<br><small style="color:#7a5a7a">${first?"+20 XP · +20 🪙 · +1 ⭐ · ❤️ Max HP grew to "+mhp()+(lv()>L?" · 🎉 Level up! "+rk():""):"Practice win · +10 🪙"}</small></div>${BTN(i)}`)}
function ask(q,head,cb){const o=sh(q[2].map((t,k)=>[t,k]));K={q,o,cb,lock:0};ui(`<div class="cd">${head}</div><div class="cd"><b>${q[1]}</b>${o.map((x,k)=>`<button class="opt" onclick="pk(${k})"><b class="lt">${"ABCD"[k]}</b>${x[0]}</button>`).join("")}<div id="fb"></div></div>`)}
function pk(k){if(K.lock)return;K.lock=1;const ok=K.o[k][1]===K.q[3],bs=[...document.querySelectorAll(".opt")];bs.forEach((b,j)=>{b.disabled=true;if(K.o[j][1]===K.q[3])b.classList.add("ok")});if(!ok)bs[k].classList.add("bad");
$("fb").innerHTML=`<p><b>${ok?"✅ Correct!":"❌ Wrong!"}</b></p><div class="ex">${K.q[4]}</div><button class="b g" onclick="K.cb(${ok})">Next ➜</button>`}
function friends(){ui(`<div class="cd"><h2>👥 Play with Friends</h2><p>Pass-and-play duel on this device: 10 questions, players take turns. Highest score wins!</p><input id="f2" placeholder="Friend's name"><button class="b g" onclick="duel()">⚔️ Start duel</button></div><button class="b" onclick="menu()">Back</button>`)}
function duel(r){D={n:r?D.n:[P.name,$("f2").value.trim()||"Friend"],s:[0,0],i:0,qs:mixQs(10)};dq()}
function dq(){if(D.i>=10){const a=D.s[0],b=D.s[1];return ui(`<div class="cd"><div class="big">🏁</div><h2>${a==b?"It's a draw! 🤝":esc(a>b?D.n[0]:D.n[1])+" wins! 🏆"}</h2><p>${esc(D.n[0])} ${a} – ${b} ${esc(D.n[1])}</p><button class="b g" onclick="duel(1)">Rematch</button><button class="b" onclick="menu()">Menu</button></div>`)}
const p=D.i%2;ask(D.qs[D.i],`<b>👥 ${esc(D.n[p])}'s turn</b><br><small>Q${D.i+1}/10 · ${esc(D.n[0])} ${D.s[0]} – ${D.s[1]} ${esc(D.n[1])}</small>`,ok=>{if(ok)D.s[p]++;D.i++;dq()})}
function arena(){A={r:["Byte Bandit","Hash Hunter","Logic Lord","Pigeon Phantom"][Math.floor(Math.random()*4)],s:0,b:0,i:0,qs:mixQs(10)};aq()}
function aq(){if(A.i>=10){const w=A.s>A.b;if(w){P.coins+=30;P.xp+=25;P.arena=(P.arena||0)+1}sv();hud();return ui(`<div class="cd"><div class="big">${w?"🏆":A.s==A.b?"🤝":"💀"}</div><h2>${w?"You beat "+A.r+"!":A.s==A.b?"Draw!":A.r+" wins!"}</h2><p>${A.s} – ${A.b}${w?"<br>+30 🪙 · +25 XP":""}</p><button class="b g" onclick="arena()">⚔️ New match</button><button class="b" onclick="menu()">Menu</button></div>`)}
ask(A.qs[A.i],`<b>🌐 Online Arena · vs ${A.r}</b><br><small>Q${A.i+1}/10 · You ${A.s} – ${A.b} ${A.r}</small>`,ok=>{if(ok)A.s++;if(Math.random()<.6)A.b++;A.i++;aq()})}
function quick(){A={s:0,i:0,qs:mixQs(10)};qq()}
function qq(){if(A.i>=10){const x=A.s*10;P.xp+=x;P.coins+=A.s*2;sv();hud();const r=A.s>=9?"Grandmaster 🧙":A.s>=7?"Champion ⚔️":A.s>=4?"Apprentice 🛡️":"Novice 🌱";return ui(`<div class="cd"><div class="big">🏆</div><h2>Quest complete!</h2><p><b>${r}</b><br>Score ${A.s}/10 · +${x} XP · +${A.s*2} 🪙</p><button class="b g" onclick="quick()">🔁 Play again</button><button class="b" onclick="menu()">Menu</button></div>`)}
ask(A.qs[A.i],`<b>⚡ 10-Question Quest</b><br><small>Q${A.i+1}/10 · Score ${A.s}</small>`,ok=>{if(ok)A.s++;A.i++;qq()})}
refresh();login();
</script></body></html>
